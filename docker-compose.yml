# ============================================================
# Employee Management System - runs all three parts together:
#   sqlserver (database)  <-  backend (API)  <-  frontend (React + nginx)
# Start:  docker compose up --build
# Stop:   docker compose down        (data is kept in the volume)
# ============================================================

services:

  # ---------- Database ----------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}        # read from the .env file
    ports:
      - "1434:1433"                            # SSMS: localhost,1434 (1433 is your dev container)
    volumes:
      - sqlserver-data:/var/opt/mssql          # database files live here, outside the container
    healthcheck:
      # "Is SQL Server ready to accept queries?" - the backend waits for this to pass.
      # $$ means "a literal $", so the variable is read INSIDE the container.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------- Backend API ----------
  backend:
    build: ./backend/EmployeeManagement.Api
    environment:
      # Double underscore = nested setting, i.e. ConnectionStrings:DefaultConnection.
      # "sqlserver" is the service name above; Docker turns it into a hostname.
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=EmployeeManagementDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "5158:8080"                            # Postman can still use http://localhost:5158
    depends_on:
      sqlserver:
        condition: service_healthy             # don't start until the database is ready

  # ---------- Frontend ----------
  frontend:
    build: ./frontend
    ports:
      - "3000:80"                              # open http://localhost:3000
    depends_on:
      - backend

volumes:
  sqlserver-data:                              # named volume = persists across restarts
